services:
  - type: web
    name: meridian-backend
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_BASE_URL
        value: "https://api.tavily.com"
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CHROMA_SERVER_HOST
        value: "api.trychroma.com"
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: SUMMARY_MODEL
        value: "openai/gpt-4o-mini"
      - key: RESEARCH_MODEL
        value: "openai/gpt-4o-mini"
      - key: MIN_MESSAGES_FOR_AUTO_SUMMARISE
        value: "5"

  - type: web
    name: meridian-worker
    env: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_BASE_URL
        value: "https://api.tavily.com"
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      - key: CHROMA_SERVER_HOST
        value: "api.trychroma.com"
      - key: EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: SUMMARY_MODEL
        value: "openai/gpt-4o-mini"
      - key: RESEARCH_MODEL
        value: "openai/gpt-4o-mini"
      - key: MIN_MESSAGES_FOR_AUTO_SUMMARISE
        value: "5"