[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry\\.util\\._importlib_metadata",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:Warning",
]
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "BLE", "ASYNC", "DTZ", "SIM"]