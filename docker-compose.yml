services:
  postgres:
    image: postgres:16
    container_name: meridian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data

volumes:
  meridian_postgres_data: